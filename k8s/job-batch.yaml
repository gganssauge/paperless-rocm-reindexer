apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-rocm-reindexer-batch
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless-rocm-reindexer
    app.kubernetes.io/part-of: paperless
    app.kubernetes.io/component: reindexer-batch
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-rocm-reindexer
        app.kubernetes.io/part-of: paperless
        app.kubernetes.io/component: reindexer-batch
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 10001
      containers:
        - name: reindexer
          image: ghcr.io/gorki120/paperless-rocm-reindexer:latest
          imagePullPolicy: IfNotPresent
          args:
            - "batch"
          envFrom:
            - configMapRef:
                name: paperless-rocm-reindexer-config
            - secretRef:
                name: paperless-rocm-reindexer-secret
          volumeMounts:
            - name: paperless-media
              mountPath: /media
            - name: reindexer-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: reindexer-data
          persistentVolumeClaim:
            claimName: paperless-reindexer-data
