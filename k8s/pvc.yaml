apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-reindexer-data
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless-rocm-reindexer
    app.kubernetes.io/part-of: paperless
    app.kubernetes.io/component: reindexer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-zfs
  resources:
    requests:
      storage: 1Gi
