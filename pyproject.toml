[project]
name = "paperless-rocm-reindexer"
version = "0.1.0"
description = "Batch & Continuous Reindexing Engine for Paperless-ngx powered by rocm-ocr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.15.1",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "rich>=13.9.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.6",
    "ty>=0.0.1a15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_rocm_reindexer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
relative_files = true
source = ["paperless_rocm_reindexer"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C901"]
ignore = [
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["EXE001", "E402", "F401", "F601", "E712", "C901"]
"tests/*" = ["E402", "F601", "F841", "E712", "C901"]
