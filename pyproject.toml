[project]
name = "paperless-rocm-reindexer"
version = "0.1.0"
description = "Batch & Continuous Reindexing Engine for Paperless-ngx powered by rocm-ocr"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Gottfried Ganßauge", email = "ganssauge@gorki120.de" },
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "asyncpg",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "rich",
    "typer",
]

[project.scripts]
paperless-rocm-reindexer = "paperless_rocm_reindexer.cli:app"
reindex = "paperless_rocm_reindexer.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_rocm_reindexer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
relative_files = true
source = ["paperless_rocm_reindexer"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C901"]
ignore = [
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["EXE001", "E402", "F401", "F601", "E712", "C901"]
"tests/*" = ["E402", "F601", "F841", "E712", "C901"]
